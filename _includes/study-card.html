<article class="flex flex-col overflow-hidden rounded-3xl bg-surface shadow-card sm:flex-row sm:items-center">
    <div class="flex-shrink-0 p-4 sm:w-48">
        <div class="flex aspect-square w-full items-center justify-center overflow-hidden rounded-2xl bg-white p-3 ring-1 ring-line">
            <img class="max-h-full max-w-full object-contain" src="{{ include.study.img | relative_url }}" alt="{{ include.study.company | default: include.study.title | escape }}" width="320" height="320" loading="lazy" decoding="async">
        </div>
    </div>
    <div class="min-w-0 flex-1 p-6 sm:pl-2">
        <h3 class="text-lg font-bold leading-snug tracking-tight">{{ include.study.title | escape }}</h3>
        {% if include.study.company or include.study.date %}
        <p class="mt-1 text-sm text-muted">{{ include.study.company | escape }}{% if include.study.company and include.study.date %} · {% endif %}{{ include.study.date | escape }}</p>
        {% endif %}
    </div>
</article>
