<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de impresión 3D</title>
    <link rel="icon" type="image/png" href="img/mini_img.png">
    <link rel="shortcut icon" type="image/x-icon" href="img/mini_img.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="img/mini_img.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="script.js"></script>

    <!-- Fuente local -->
    <style>
        @font-face {
            font-family: 'Monaco';
            src: url('../../fonts/Monaco.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Monaco', monospace;
        }

        #description {
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>

<body class="bg-orange-50 flex flex-col items-center min-h-screen">

    <header class="w-full bg-gradient-to-r from-orange-500 to-red-500 shadow-md p-6 text-center">
        <button id="backBtn"
            class="absolute left-6 top-6 bg-white text-orange-600 hover:bg-orange-50 px-3 py-1 rounded-full shadow-sm">
            ← Atrás
        </button>
        <h1 class="text-3xl font-semibold text-white">💡 Calculadora de Impresión 3D</h1>
        <div id="translate-container" class="absolute right-6 top-6">
            <button id="translate-btn"
                class="bg-white shadow-md text-orange-600 text-sm px-3 py-2 rounded-lg hover:bg-orange-50 transition">
                🌐 Traducir
            </button>
        </div>
    </header>

    <main id="calculator-body" class="w-full flex flex-col items-center">
        <section class="w-full max-w-2xl bg-white shadow-md rounded-2xl p-8 mt-10 mx-4">

            <label class="block text-slate-700 font-medium mb-2">Material:</label>
            <select id="material"
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent mb-4">
                <option value="">Cargando materiales...</option>
            </select>

            <label class="block text-slate-700 font-medium mb-2 mt-4">Peso de la pieza (g):</label>
            <input id="peso" type="number" step="0.01" placeholder="Ej: 120"
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent mb-4" />

            <label class="block text-slate-700 font-medium mb-2 mt-4">Tiempo de impresión (h):</label>
            <input id="tiempo" type="number" step="0.1" placeholder="Ej: 5"
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent mb-4" />

            <button onclick="calcular()"
                class="w-full mt-6 px-6 py-3 bg-orange-500 text-white font-medium rounded-lg hover:bg-orange-600 transition shadow-md">
                Calcular precio
            </button>

            <div id="resultado" class="hidden mt-6 p-4 bg-green-50 border-2 border-green-500 rounded-lg text-center">
                <p class="text-xl font-bold text-green-700"></p>
            </div>

        </section>
    </main>

    <!-- Modal -->
    <div id="modalOverlay"
        class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md mx-4 text-center">
            <p id="modalMessage" class="text-lg text-slate-700 mb-6"></p>
            <button onclick="cerrarModal()"
                class="px-8 py-2 bg-orange-500 text-white font-medium rounded-lg hover:bg-orange-600 transition mx-auto">
                Aceptar
            </button>
        </div>
    </div>

    <footer class="text-center text-sm text-slate-500 mt-auto p-6 mb-6">
        © 2025 Aarón Granado
    </footer>
</body>

</html>
