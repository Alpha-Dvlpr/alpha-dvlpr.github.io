<article class="flex flex-col overflow-hidden rounded-2xl bg-white shadow-md md:flex-row">
    <div class="flex-shrink-0 p-2 md:w-1/3">
        <div class="flex aspect-square w-full items-center justify-center overflow-hidden rounded-xl bg-white shadow-md">
            <img class="max-h-full max-w-full object-contain" src="{{ include.study.img | relative_url }}" alt="{{ include.study.company | default: include.study.title | escape }}" width="320" height="320" loading="lazy" decoding="async">
        </div>
    </div>
    <div class="flex flex-col justify-center p-4 md:w-2/3">
        <h3 class="text-xl font-semibold">{{ include.study.title | escape }}</h3>
        {% if include.study.company or include.study.date %}
        <p class="mt-1 text-sm text-gray-600">{{ include.study.company | escape }}{% if include.study.company and include.study.date %} | {% endif %}{{ include.study.date | escape }}</p>
        {% endif %}
    </div>
</article>
